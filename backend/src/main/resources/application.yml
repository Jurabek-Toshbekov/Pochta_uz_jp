# =====================================================================
# Asosiy konfiguratsiya. Hech qanday sir bu faylda bo'lmaydi (§1.2) —
# barcha maxfiy qiymatlar environment variable'dan keladi.
# =====================================================================
spring:
  application:
    name: pochta-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pochta}
    username: ${DB_USERNAME:pochta}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      pool-name: pochta-pool

  jpa:
    # §1.3 — MUTLAQ QOIDA: sxema faqat Flyway orqali o'zgaradi.
    # create/update qiymatlari taqiqlangan.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false

  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
        queue-capacity: 500
      thread-name-prefix: pochta-async-

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: health
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# --- Telegram (BotProperties) ---
bot:
  token: ${BOT_TOKEN}
  username: ${BOT_USERNAME:uzb_jp_elon_bot}
  channel-chat-id: ${CHANNEL_CHAT_ID:}
  channel-username: ${CHANNEL_USERNAME:}
  miniapp-url: ${MINIAPP_URL:}
  init-data-max-age-seconds: ${INITDATA_MAX_AGE_SECONDS:86400}

# --- Ilova sozlamalari (AppProperties) ---
app:
  admin-jwt-secret: ${ADMIN_JWT_SECRET:}
  admin-telegram-ids: ${ADMIN_TELEGRAM_IDS:}
  admin-url: ${ADMIN_URL:}
  rate-limit-posts-per-day: ${RATE_LIMIT_POSTS_PER_DAY:5}
  rate-limit-requests-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:60}

logging:
  level:
    root: INFO
    uz.pochtajp: ${LOG_LEVEL_APP:INFO}
