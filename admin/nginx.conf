server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin paneli hech qanday iframe ichida ochilmasligi kerak —
    # Mini App'dan farqli o'laroq bu yerda clickjacking real xavf.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Panel qidiruv tizimlariga tushmasin.
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter — barcha marshrutlar index.html ga tushadi.
    location / {
        try_files $uri /index.html;
    }
}
