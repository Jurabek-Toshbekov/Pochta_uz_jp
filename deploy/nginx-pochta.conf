# /etc/nginx/sites-available/pochta
#
# Backend 127.0.0.1:8080 da tinglaydi (SERVER_ADDRESS=127.0.0.1) va
# tashqaridan ko'rinmaydi — butun tashqi trafik shu blokdan o'tadi.
# Shu sabab ufw yoqish shart emas.
#
# 443 bloki va yo'naltirish certbot tomonidan qo'shiladi:
#   certbot --nginx -d api99.e-tex.uz --redirect
#
# Serverda boshqa sayt (BookShare, api.e-tex.uz) ham bor — u alohida
# faylda turadi va bu blok unga tegmaydi.

server {
    listen 80;
    server_name api99.e-tex.uz;

    # CORS'ni Spring o'zi qo'yadi (MINIAPP_URL bo'yicha, §7.2).
    # nginx bu yerga aralashmaydi: `add_header Access-Control-*` qo'shilsa
    # sarlavha ikki marta qaytadi va brauzer so'rovni butunlay rad etadi.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
